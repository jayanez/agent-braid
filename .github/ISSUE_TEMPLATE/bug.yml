name: Bug report
description: Report reproducible incorrect behavior in Agent Braid.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, proprietary traces, personal data or live exploit details.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the exact command, bounded input and output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Environment and observation boundary
      description: Include Python, Git, operating system and anything excluded from observation.
    validations:
      required: true
