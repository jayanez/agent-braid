name: Reproduce bounded M4 runtime

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Full public commit SHA to reproduce
        required: true
        type: string

permissions:
  contents: read

jobs:
  reproduce:
    name: Fresh-process Linux runtime reproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require a public immutable candidate
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$REPOSITORY_PRIVATE" = "false"

      - name: Check out the public candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install development-only schema validator
        run: python3 -m pip install --no-cache-dir -r requirements-dev.txt

      - name: Confirm the clean candidate and Linux x86_64
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test -z "$(git status --porcelain)"
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"

      - name: Capture bounded runtime reproduction
        run: python3 -m scripts.reproduce_m4_runtime --output "$RUNNER_TEMP/m4-evidence/reproduction.json"

      - name: Publish the public record in logs and job summary
        if: ${{ always() }}
        run: python3 -m scripts.summarize_public_experiment --record "$RUNNER_TEMP/m4-evidence/reproduction.json"
