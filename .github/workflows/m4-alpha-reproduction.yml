name: Reproduce bounded M4 alpha

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Full public commit SHA to reproduce
        required: true
        type: string
      profile_cost:
        description: Also capture the descriptive M4 cost sidecar (public owned fixtures only)
        required: false
        default: false
        type: boolean
      baseline_commit:
        description: Optional full public baseline SHA for the same-host descriptive cost comparison
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  reproduce:
    name: Fresh-process Linux alpha core and protocol reproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require a public immutable candidate
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          BASELINE_COMMIT: ${{ inputs.baseline_commit }}
          PROFILE_COST: ${{ inputs.profile_cost }}
        run: |
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$REPOSITORY_PRIVATE" = "false"
          if [[ -n "$BASELINE_COMMIT" ]]; then
            [[ "$BASELINE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
            test "$PROFILE_COST" = "true"
          fi

      - name: Check out the public candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install development-only schema validator
        run: python3 -m pip install --no-cache-dir -r requirements-dev.txt

      - name: Confirm the clean candidate and Linux x86_64
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test -z "$(git status --porcelain)"
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"

      - name: Capture bounded alpha reproduction without model credentials
        run: python3 -m scripts.reproduce_m4_alpha --output "$RUNNER_TEMP/m4-alpha-evidence/reproduction.json"

      - name: Capture descriptive cost sidecar without changing the measurement protocol
        if: ${{ inputs.profile_cost }}
        run: python3 scripts/profile_m4_alpha.py --output "$RUNNER_TEMP/m4-alpha-evidence/cost-profile.json"

      - name: Reproduce the public baseline and compare full cost on the same host
        if: ${{ inputs.profile_cost && inputs.baseline_commit != '' }}
        shell: bash
        env:
          BASELINE_COMMIT: ${{ inputs.baseline_commit }}
        run: |
          git clone --no-local --no-checkout -- . "$RUNNER_TEMP/m4-baseline"
          git -C "$RUNNER_TEMP/m4-baseline" checkout --detach "$BASELINE_COMMIT"
          test "$(git -C "$RUNNER_TEMP/m4-baseline" rev-parse HEAD)" = "$BASELINE_COMMIT"
          test -z "$(git -C "$RUNNER_TEMP/m4-baseline" status --porcelain)"
          python3 scripts/profile_m4_alpha.py --checkout "$RUNNER_TEMP/m4-baseline" \
            --output "$RUNNER_TEMP/m4-alpha-evidence/baseline-cost-profile.json"
          python3 scripts/profile_m4_alpha.py \
            --compare "$RUNNER_TEMP/m4-alpha-evidence/baseline-cost-profile.json" \
              "$RUNNER_TEMP/m4-alpha-evidence/cost-profile.json" \
            --output "$RUNNER_TEMP/m4-alpha-evidence/cost-comparison.json"

      - name: Publish the public record in logs and job summary
        if: ${{ always() }}
        run: python3 -m scripts.summarize_public_experiment --record "$RUNNER_TEMP/m4-alpha-evidence/reproduction.json"

      - name: Publish the public cost sidecar in logs and job summary
        if: ${{ always() && inputs.profile_cost }}
        run: python3 -m scripts.summarize_public_experiment --record "$RUNNER_TEMP/m4-alpha-evidence/cost-profile.json"

      - name: Publish the public baseline cost sidecar in logs and job summary
        if: ${{ always() && inputs.profile_cost && inputs.baseline_commit != '' }}
        run: python3 -m scripts.summarize_public_experiment --record "$RUNNER_TEMP/m4-alpha-evidence/baseline-cost-profile.json"

      - name: Publish the descriptive cost comparison in public logs
        if: ${{ always() && inputs.profile_cost && inputs.baseline_commit != '' }}
        run: python3 -m scripts.summarize_public_experiment --record "$RUNNER_TEMP/m4-alpha-evidence/cost-comparison.json"

  m35_synthetic:
    name: Public synthetic M3.5 controls
    uses: ./.github/workflows/m35-synthetic-reproduction.yml
    with:
      candidate_commit: ${{ inputs.candidate_commit }}
