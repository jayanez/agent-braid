name: Validate repository

on:
  push:
    branches: [develop, main]
  pull_request:

# Supersede only PR validation. Unique non-PR groups preserve every post-merge run,
# including pending runs that a shared cancel-in-progress: false group could evict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify:
    name: Classify validation impact
    runs-on: ubuntu-latest
    outputs:
      spec_kit_integration: ${{ steps.impact.outputs.spec_kit_integration }}
      effective_profile: ${{ steps.impact.outputs.effective_profile }}
      unknown_paths: ${{ steps.impact.outputs.unknown_paths }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Plan validation impact
        id: impact
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD: ${{ github.sha }}
        run: |
          base="$EVENT_BASE"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          python3 scripts/validate_change.py \
            --base "$base" --head "$EVENT_HEAD" --profile quick \
            --format github --plan-only >> "$GITHUB_OUTPUT"

  invariants:
    name: Fast repository invariants
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate foundational invariants
        run: python3 scripts/validate_repository.py

      - name: Check Constitution replica
        run: python3 scripts/constitution_replica.py check

      - name: Install and smoke-test the alpha CLI
        run: |
          python3 -m pip install --no-deps --editable .
          agent-braid --help

      - name: Check whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif [[ "${{ github.event.before }}" =~ ^[0-9a-f]{40}$ ]] && \
               [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}...HEAD"
          else
            git diff-tree --check --root --no-commit-id -r HEAD
          fi

  tests:
    name: Complete Python test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Restore reviewed public SPEC-012 history
        run: python3 scripts/restore_public_spec_history.py

      - name: Run complete bounded and negative test suite
        run: python3 -m unittest discover -s tests -v

  governance_science:
    name: Governance, contracts and scientific controls
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development-only contract validator
        run: python3 -m pip install -r requirements-dev.txt

      - name: Validate versioned contract corpus
        run: python3 scripts/validate_contracts.py

      - name: Validate formal M0 closure provenance
        if: ${{ hashFiles('docs/releases/public-export.json') == '' }}
        run: python3 scripts/validate_m0_closure.py closure

      - name: Validate formal M1 closure provenance
        if: ${{ hashFiles('docs/releases/public-export.json') == '' }}
        run: python3 scripts/validate_m1_closure.py closure

      - name: Validate M0.5 candidate or closure provenance
        if: ${{ hashFiles('docs/releases/public-export.json') == '' }}
        shell: bash
        run: |
          if [[ -f specs/008-m0.5-closure/founder-review.json ]]; then
            python3 scripts/validate_m05_closure.py
          else
            python3 scripts/validate_m05_closure.py --candidate
          fi

      - name: Validate publication provenance boundary
        shell: bash
        run: |
          if [[ -f docs/releases/public-export.json ]]; then
            python3 scripts/validate_publication.py --portable
          else
            python3 scripts/validate_publication.py --source
          fi

      - name: Validate release validation status records
        run: python3 scripts/validate_release_records.py

      - name: Validate research radar provenance and milestone review
        run: python3 scripts/validate_research_radar.py --milestone M0.5

      - name: Validate reproducible market scenarios
        run: python3 scripts/market_sizing.py --check

      - name: Check finite algebraic controls
        run: python3 -m research.lab.controls

  spec_kit:
    name: Spec Kit structure and render
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-speckit.txt

      - name: Install pinned Spec Kit tooling
        run: python3 -m pip install -r requirements-dev.txt -r requirements-speckit.txt

      - name: Restore reviewed public SPEC-012 history
        run: python3 scripts/restore_public_spec_history.py

      - name: Validate shared Spec Kit structural gates
        run: python3 scripts/validate_spec_kit.py

      - name: Re-render both official integrations
        run: python3 scripts/spec_kit.py check

  spec_kit_integration:
    name: Spec Kit solo and dual integration matrix
    needs: classify
    # Only a known unselected classification can skip the specialist matrix.
    if: >-
      ${{
        needs.classify.outputs.spec_kit_integration != 'false' ||
        needs.classify.outputs.unknown_paths != 'false' ||
        (needs.classify.outputs.effective_profile != 'quick' &&
         needs.classify.outputs.effective_profile != 'sensitive')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-speckit.txt

      - name: Install pinned Spec Kit tooling
        run: python3 -m pip install -r requirements-speckit.txt

      - name: Restore reviewed public SPEC-012 history
        run: python3 scripts/restore_public_spec_history.py

      - name: Test Codex-only, Claude-only and dual configurations
        run: python3 scripts/test_spec_kit_integration.py

  validate:
    name: validate
    needs:
      - classify
      - invariants
      - tests
      - governance_science
      - spec_kit
      - spec_kit_integration
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject cancellation before aggregation
        id: cancellation
        if: ${{ cancelled() }}
        run: exit 1

      - name: Require every mandatory gate
        if: ${{ always() }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          WORKFLOW_CANCELLED: ${{ steps.cancellation.outcome != 'skipped' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          def reject(message):
              print(f"Aggregate validation rejected: {message}", file=sys.stderr)
              sys.exit(1)

          if os.environ.get("WORKFLOW_CANCELLED") != "false":
              reject("workflow cancelled or cancellation status missing")
          try:
              needs = json.loads(os.environ["NEEDS_JSON"])
          except (KeyError, ValueError):
              reject("missing or malformed prerequisite results")
          if not isinstance(needs, dict):
              reject("prerequisite results must be an object")
          mandatory = ("classify", "invariants", "tests", "governance_science", "spec_kit")
          for name in mandatory:
              job = needs.get(name)
              if not isinstance(job, dict) or job.get("result") != "success":
                  reject(f"mandatory prerequisite {name} did not succeed")
          outputs = needs["classify"].get("outputs")
          fields = {"spec_kit_integration", "effective_profile", "unknown_paths"}
          if not isinstance(outputs, dict) or set(outputs) != fields:
              reject("classification output fields are missing or unknown")
          selected = outputs["spec_kit_integration"]
          unknown = outputs["unknown_paths"]
          profile = outputs["effective_profile"]
          if (selected not in ("true", "false") or unknown not in ("true", "false")
                  or profile not in ("quick", "sensitive")):
              reject("classification output values are malformed")
          if ((unknown == "true" and selected != "true")
                  or ((unknown == "true" or selected == "true") and profile != "sensitive")):
              reject("classification uncertainty did not select sensitive specialist validation")
          specialist = needs.get("spec_kit_integration")
          allowed = ("success",) if selected == "true" else ("success", "skipped")
          if not isinstance(specialist, dict) or specialist.get("result") not in allowed:
              reject("specialist did not succeed or was skipped without permission")
          PY

      - name: Confirm aggregate validation
        if: ${{ success() && !cancelled() }}
        run: echo "All mandatory validation jobs passed; conditional specialist status remains visible separately."

      # Re-read cancellation after the guard/confirmation; cancellation can arrive
      # after their environment/conditions were evaluated. Completed runs still
      # describe only their own SHA, never a newer candidate or semantic approval.
      - name: Reject cancellation during aggregation
        if: ${{ cancelled() }}
        run: exit 1
